[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twitter-pandas"
version = "0.0.1"
description = "A library for getting and interacting with twitter data via pandas"
readme = "README.md"
license = { text = "BSD" }
authors = [{ name = "Will McGinnis", email = "will@pedalwrencher.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas",
    "tweepy>=3.10,<4",
]

[project.urls]
Homepage = "https://github.com/wdm0006/twitterpandas"

[dependency-groups]
dev = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx_rtd_theme"]

[tool.hatch.build.targets.wheel]
packages = ["twitterpandas"]

[tool.uv]
default-groups = ["dev"]
